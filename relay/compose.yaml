services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8788"
      RELAY_HOST: 0.0.0.0
      RELAY_DB_PATH: /data/relay.sqlite
      RELAY_PEPPER: ${RELAY_PEPPER:?Set RELAY_PEPPER in the deployment environment}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-https://lapcontroller.vercel.app}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - relay-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  relay-data:
